<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DH101 — Page</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-row">
        <div class="nav-left">
          <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
          <h1 class="brand">DH101</h1>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="viewer.html?file=../curriculum.md">Curriculum</a>
          <a href="viewer.html?file=../about.md">About</a>
          <a href="viewer.html?file=../how-i-use-ai.md">AI &amp; Ethics</a>
          <a href="viewer.html?file=../accessibility.md">Accessibility</a>
          <a href="reflections.html">Reflections</a>
        </nav>
      </div>
    </header>

    <main class="markdown-page">
      <section class="markdown-content container">
        <div id="content">
          <p>Loading…</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; 2026 Finley O'Brien — DH101 portfolio</small>
      </div>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const contentEl = document.getElementById("content");

      const setMessage = (message) => {
        contentEl.innerHTML = `<p>${message}</p>`;
      };

      const stripFrontMatter = (markdown) => markdown.replace(/^---[\s\S]*?---\s*/m, "");

      const resolveRelativeImages = (baseUrl) => {
        const images = contentEl.querySelectorAll("img");
        images.forEach((img) => {
          const src = img.getAttribute("src");
          if (!src || /^(?:[a-z]+:|\/)/i.test(src)) {
            return;
          }
          img.src = new URL(src, baseUrl).toString();
        });
      };

      const setTitleFromMarkdown = (markdown) => {
        const match = markdown.match(/^#\s+(.+)$/m);
        if (match && match[1]) {
          document.title = `DH101 — ${match[1].trim()}`;
        }
      };

      if (!file) {
        setMessage("No page specified.");
      } else {
        fetch(file)
          .then((response) => {
            if (!response.ok) {
              throw new Error("Page not found.");
            }
            return response.text();
          })
          .then((markdown) => {
            const cleaned = stripFrontMatter(markdown);
            setTitleFromMarkdown(cleaned);
            contentEl.innerHTML = marked.parse(cleaned);
            const baseUrl = new URL(file, window.location.href);
            resolveRelativeImages(baseUrl);
          })
          .catch(() => {
            setMessage("Sorry, that page could not be loaded.");
          });
      }
    </script>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const root = document.documentElement;
      const storedTheme = localStorage.getItem("theme");

      if (storedTheme) {
        root.setAttribute("data-theme", storedTheme);
      }

      const updateLabel = () => {
        const isDark = root.getAttribute("data-theme") === "dark";
        themeToggle.textContent = isDark ? "Light mode" : "Dark mode";
      };

      if (themeToggle) {
        updateLabel();
        themeToggle.addEventListener("click", () => {
          const isDark = root.getAttribute("data-theme") === "dark";
          const nextTheme = isDark ? "light" : "dark";
          root.setAttribute("data-theme", nextTheme);
          localStorage.setItem("theme", nextTheme);
          updateLabel();
        });
      }
    </script>
  </body>
</html>
