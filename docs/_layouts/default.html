<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: "DH101" }}</title>
    <link rel="stylesheet" href="{{ "/styles.css" | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-row">
        <div class="nav-left">
          <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
          <h1 class="brand">DH101</h1>
        </div>
        <nav class="nav">
          <a href="{{ "/index.html" | relative_url }}">Home</a>
          <a href="{{ "/projects.html" | relative_url }}">Projects</a>
          <a href="{{ "/viewer.html" | relative_url }}?file=curriculum.md">Curriculum</a>
          <a href="{{ "/viewer.html" | relative_url }}?file=about.md">About</a>
          <a href="{{ "/viewer.html" | relative_url }}?file=how-i-use-ai.md">AI &amp; Ethics</a>
          <a href="{{ "/viewer.html" | relative_url }}?file=accessibility.md">Accessibility</a>
          <a href="{{ "/reflections.html" | relative_url }}">Reflections</a>
        </nav>
      </div>
    </header>

    <main class="markdown-page">
      <section class="markdown-content container">
        {{ content }}
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; 2026 Finley O'Brien — DH101 portfolio</small>
      </div>
    </footer>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const root = document.documentElement;
      const storedTheme = localStorage.getItem("theme");

      if (storedTheme) {
        root.setAttribute("data-theme", storedTheme);
      }

      const updateLabel = () => {
        const isDark = root.getAttribute("data-theme") === "dark";
        themeToggle.textContent = isDark ? "Light mode" : "Dark mode";
      };

      if (themeToggle) {
        updateLabel();
        themeToggle.addEventListener("click", () => {
          const isDark = root.getAttribute("data-theme") === "dark";
          const nextTheme = isDark ? "light" : "dark";
          root.setAttribute("data-theme", nextTheme);
          localStorage.setItem("theme", nextTheme);
          updateLabel();
        });
      }
    </script>
  </body>
</html>
